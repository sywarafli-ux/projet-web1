<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="portfolio">

    <header>
        <h1>Mon Portfolio</h1>
    </header>

    <main>
        <p>Bienvenue sur mon portfolio ! Je suis étudiant en informatique.</p>

        <section class="galerie">
            <a href="https://www.example.com/projetA">
                <img src="boy.png.png" alt="Projet A" width="150" height="150">
            </a>
            <a href="https://www.example.com/projetB">
                <img src="girl.png.jpg" alt="Projet B" width="150" height="150">
            </a>
            <a href="https://www.example.com/projetC">
                <img src="HTML5.png.jpg" alt="Projet C" width="150" height="150">
            </a>
        </section>

        <table>
            <thead>
                <tr>
                    <th>Nom du Projet</th>
                    <th>Description</th>
                    <th>Technologies</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Projet A</td>
                    <td>Description du projet A</td>
                    <td>HTML, CSS</td>
                </tr>
                <tr>
                    <td>Projet B</td>
                    <td>Description du projet B</td>
                    <td>JavaScript</td>
                </tr>
                <tr>
                    <td>Projet C</td>
                    <td>Description du projet C</td>
                    <td>Python</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total : 3 projets</td>
                </tr>
            </tfoot>
        </table>
    </main>

    <footer>
        <p>&copy; 2024 Mon Portfolio</p>
    </footer>

</html>
